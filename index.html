<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les fonctions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF3F7; --paper-2:#FFFFFF; --grid:#D6E2EC; --ink:#1B2A41; --ink-2:#51627A; --line:#C3D0DC;
  --blue:#2F5BD3; --blue-soft:#DCE5FB; --green:#23945A; --green-soft:#D7F0E1; --amber:#D9900F; --amber-soft:#FBEBCB;
  --red:#D0443A; --red-soft:#F8DAD7; --grey:#AEB9C5; --track:#DDE5EC; --shadow:0 3px 0 #C3D0DC;
  --c1:#2F5BD3; --c2:#D0443A; --c3:#23945A; --c4:#B7750A; --pg:#C9D6E2; --pgm:#E3EBF2;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131C2B; --paper-2:#1C2739; --grid:#1D2A3D; --ink:#E7EDF5; --ink-2:#9AAAC0; --line:#2E3D55;
    --blue:#7FA2FF; --blue-soft:#22325A; --green:#3CC47C; --green-soft:#173A2A; --amber:#F0AE3C; --amber-soft:#3A2E17;
    --red:#F0685E; --red-soft:#3D1F1F; --grey:#56657B; --track:#2A3850; --shadow:0 3px 0 #0B111B;
    --c1:#7FA2FF; --c2:#F0685E; --c3:#3CC47C; --c4:#F0AE3C; --pg:#33445E; --pgm:#243247;
  }
}
:root[data-theme="dark"]{
  --paper:#131C2B; --paper-2:#1C2739; --grid:#1D2A3D; --ink:#E7EDF5; --ink-2:#9AAAC0; --line:#2E3D55;
  --blue:#7FA2FF; --blue-soft:#22325A; --green:#3CC47C; --green-soft:#173A2A; --amber:#F0AE3C; --amber-soft:#3A2E17;
  --red:#F0685E; --red-soft:#3D1F1F; --grey:#56657B; --track:#2A3850; --shadow:0 3px 0 #0B111B;
  --c1:#7FA2FF; --c2:#F0685E; --c3:#3CC47C; --c4:#F0AE3C; --pg:#33445E; --pgm:#243247;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;line-height:1.5;font-size:17px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.15}
b{font-weight:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.btn{border:2px solid var(--line);background:var(--paper-2);border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2);font-weight:400;text-decoration:underline;padding:6px 8px}
.btn.sm{padding:6px 12px;font-size:15px;border-radius:11px}
.btn.on{background:var(--blue-soft);border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.lang{border:2px solid var(--line);background:var(--paper-2);border-radius:99px;padding:4px 4px;font-weight:700;font-size:14px;display:inline-flex;gap:2px}
.lang span{padding:2px 9px;border-radius:99px;color:var(--ink-2)}
.lang span.cur{background:var(--ink);color:var(--paper)}

/* home / path */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(34px,7vw,52px);margin:0 0 6px;font-weight:800}
.hero p{margin:0;color:var(--ink-2);max-width:52ch}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h2{margin:0;font-size:26px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--paper-2);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:15px}
.path{position:relative;margin:30px auto 0;max-width:420px;padding-bottom:20px}
.step{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;position:relative}
.step:nth-child(4n+2){transform:translateX(60px)} .step:nth-child(4n+4){transform:translateX(-60px)}
.bubble{width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:var(--grey);box-shadow:0 6px 0 color-mix(in srgb,var(--grey) 60%,#000);position:relative}
.bubble.done{background:var(--green);box-shadow:0 6px 0 color-mix(in srgb,var(--green) 60%,#000)}
.bubble.now{background:var(--blue);box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.bubble.pv{background:var(--blue);box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.bubble.locked{cursor:default;background:var(--track);color:var(--grey);box-shadow:0 6px 0 var(--line)}
.bubble:not(.locked):active{transform:translateY(5px);box-shadow:none}
.bubble.now::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--blue);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.bubble.now::after{animation:none}}
.steplbl{margin-top:12px;font-weight:700;text-align:center;font-size:15px;max-width:190px;line-height:1.25}
.stars{font-size:14px;letter-spacing:2px;color:var(--amber);height:18px}
.stars .off{color:var(--track)}
.pvbanner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--amber-soft);border:2px solid var(--amber)}
.pvbanner strong{display:block;font-family:var(--display)}.pvbanner span{font-size:15px}
.tutor{margin-top:30px;font-size:14px;color:var(--ink-2);border-top:2px dashed var(--line);padding-top:14px}
.tpanel{display:grid;gap:14px;margin:18px 0}
.tpanel>div{background:var(--paper-2);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.tpanel h3{margin:0 0 4px;font-size:19px}.tpanel p{margin:0 0 10px;color:var(--ink-2);font-size:15.5px}
.report textarea{width:100%;min-height:340px;font:inherit;font-size:14.5px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--paper-2);color:var(--ink)}

/* lesson shell */
.lesson{position:fixed;inset:0;background:var(--paper);z-index:30;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lesson.open{display:flex}
.lhead{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
.bar{height:14px;border-radius:99px;background:var(--track);overflow:hidden;flex:1}
.bar>div{height:100%;border-radius:99px;background:var(--green);transition:width .35s}
.close{border:0;background:none;font-size:28px;line-height:1;color:var(--ink-2);padding:4px 8px}
.combo{font-weight:700;color:var(--amber);font-size:14px;white-space:nowrap}
.lbody{flex:1;overflow:auto;padding:4px 16px 24px;max-width:820px;width:100%;margin:0 auto}
.kind{color:var(--ink-2);font-size:14px;margin:6px 0 4px;font-weight:700}
.q{font-family:var(--display);font-weight:700;font-size:clamp(19px,4vw,24px);line-height:1.3;margin:2px 0 14px}
.q.small{font-family:var(--body);font-weight:400;font-size:18px}
.info{background:var(--paper-2);border:2px solid var(--line);border-radius:18px;padding:16px 18px;font-size:17px}
.info h3{margin:0 0 10px;font-size:23px}
.info p{margin:.5em 0}
.ex{background:var(--blue-soft);border-radius:12px;padding:10px 14px;margin:12px 0}
.warn{background:var(--red-soft);border-radius:12px;padding:10px 14px;margin:12px 0}
.info table,.tbl{border-collapse:collapse;width:100%;font-size:15.5px;margin:10px 0}
.info td,.info th,.tbl td,.tbl th{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.info th,.tbl th{background:var(--paper)}
.tw{overflow-x:auto}
.fr-term{color:var(--ink-2);font-style:italic}
.choices{display:grid;gap:12px}
.choices.cols2{grid-template-columns:1fr 1fr}
.choice{background:var(--paper-2);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:18px;box-shadow:var(--shadow);text-align:left;min-height:54px}
.choice svg{display:block;width:100%;height:auto}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice:disabled{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .choice{text-align:center;font-weight:700}
.numin{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numin input{font-size:24px;font-family:var(--display);font-weight:700;width:180px;max-width:100%;padding:9px 14px;border:2px solid var(--line);border-radius:14px;background:var(--paper-2)}
.numin input.right,.cell.right{border-color:var(--green);background:var(--green-soft)} .numin input.wrong,.cell.wrong{border-color:var(--red);background:var(--red-soft)}
.unit{font-size:20px;color:var(--ink-2)}
.slots{min-height:60px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:16px}
.slots.col,.bank.col{flex-direction:column;align-items:stretch}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{background:var(--paper-2);border:2px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 2px 0 var(--line);font-size:17px;text-align:left;min-width:42px}
.tile.mono{font-family:var(--display);font-weight:700;font-size:21px;text-align:center}
.tile.used{visibility:hidden}
.slots.right .tile{border-color:var(--green);background:var(--green-soft)} .slots.wrong .tile{border-color:var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{background:var(--paper-2);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px;box-shadow:0 2px 0 var(--line);font-size:16.5px}
.mt.sel{border-color:var(--blue);background:var(--blue-soft)}
.mt.ok{border-color:var(--green);background:var(--green-soft);opacity:.6;cursor:default}
.mt.bad{border-color:var(--red);background:var(--red-soft)}
.lfoot{border-top:2px solid var(--line);background:var(--paper-2)}
.lfoot.right{background:var(--green-soft);border-color:var(--green)} .lfoot.wrong{background:var(--red-soft);border-color:var(--red)}
.lfoot .in{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb{flex:1;min-width:220px;font-size:16px}
.fb .verdict{font-family:var(--display);font-size:21px;display:block}
.again{display:block;color:var(--ink-2);margin-top:4px}
.end{text-align:center;padding-top:5vh}
.end .big{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;margin:0}
.end .starbig{font-size:46px;letter-spacing:8px;color:var(--amber);margin:14px 0}
.end .starbig .off{color:var(--track)}
.endstats{display:flex;justify-content:center;gap:28px;margin-top:10px;color:var(--ink-2);flex-wrap:wrap}
.endstats strong{display:block;font-family:var(--display);font-size:28px;color:var(--ink)}

/* graphs */
.plot{display:block;width:100%;max-width:440px;height:auto;margin:4px auto 10px;touch-action:none;user-select:none;-webkit-user-select:none}
.plot text{font-family:var(--body);fill:var(--ink)}
.plot .tk{font-size:11px;fill:var(--ink-2)}
.plot .ttl{font-size:12.5px;font-weight:700}
.plot.tap{cursor:crosshair}
.pw{position:relative;max-width:440px;margin:0 auto}
.pw .plot{margin:0 auto}
.zone{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:34px;border:2px dashed var(--blue);border-radius:10px;background:color-mix(in srgb,var(--paper-2) 85%,transparent);display:flex;align-items:center;justify-content:center;padding:2px;font-size:13px}
.zone.hot{background:var(--blue-soft)}
.zone .dchip{font-size:12px;padding:3px 6px;box-shadow:none;white-space:nowrap;border-radius:8px}
.zone:has(.dchip){border-style:solid;min-height:0;padding:1px}
.zone.right{border-color:var(--green);border-style:solid;background:var(--green-soft)}
.zone.wrong{border-color:var(--red);border-style:solid;background:var(--red-soft)}
.readout{text-align:center;font-family:var(--display);font-weight:700;font-size:19px;margin:2px 0 8px;min-height:1.4em}
.readout small{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:var(--ink-2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px}
.sl{display:flex;align-items:center;gap:10px;max-width:440px;margin:6px auto}
.sl label{font-family:var(--display);font-weight:700;min-width:70px}
.sl input[type=range]{flex:1;accent-color:var(--blue)}
.formula{text-align:center;font-family:var(--display);font-weight:700;font-size:22px;margin:4px 0}
.hint{color:var(--ink-2);font-size:15px;text-align:center;margin:2px 0 8px}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:8px;min-height:96px;background:color-mix(in srgb,var(--paper-2) 70%,transparent)}
.bucket.hot{border-color:var(--blue);background:var(--blue-soft)}
.bucket h4{margin:0 0 6px;font-family:var(--display);font-size:16px;text-align:center}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dchip{background:var(--paper-2);border:2px solid var(--line);border-radius:12px;padding:7px 10px;box-shadow:0 2px 0 var(--line);font-size:15.5px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;max-width:100%}
.dchip svg{display:block;width:110px;height:auto}
.dchip.sel{border-color:var(--blue);background:var(--blue-soft)}
.dchip.right{border-color:var(--green);background:var(--green-soft)} .dchip.wrong{border-color:var(--red);background:var(--red-soft)}
.dragghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-60%) rotate(-3deg);opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;padding:8px;border-radius:12px;background:var(--paper)}
.ttable{border-collapse:collapse;margin:6px auto 10px;font-size:16px}
.ttable td,.ttable th{border:1px solid var(--line);padding:5px 7px;text-align:center;min-width:44px}
.ttable th{background:var(--paper);font-family:var(--display)}
.cell{width:52px;padding:5px 4px;border:2px solid var(--line);border-radius:8px;text-align:center;background:var(--paper-2);font-size:16px}
.axbox{display:grid;gap:10px;margin:6px 0 10px}
.axbox .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.axbox .row>span:first-child{font-weight:700;min-width:150px}
.numline-ctl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:440px;margin:0 auto}
.numline-ctl .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.notation{text-align:center;font-family:var(--display);font-weight:800;font-size:30px;margin:6px 0}
.machine{display:flex;align-items:flex-start;justify-content:center;gap:6px;margin:10px 0}.machine .marrow{margin-top:12px}.machine .mbox{margin-top:-14px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px}.mcol small{font-size:12.5px;color:var(--ink-2);text-align:center;line-height:1.2}
.mbox{width:104px;height:86px;border-radius:16px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px;border:3px dashed transparent}
.mbox.hot{border-color:var(--amber)}
.mbox small{font-size:13px;font-weight:500;opacity:.9}
.mslot{min-width:58px;min-height:54px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:24px;background:var(--paper-2)}
.marrow{font-size:26px;color:var(--ink-2)}
.sentence{text-align:center;font-size:17px;min-height:3em}
.track{display:block;width:100%;max-width:440px;margin:0 auto;height:auto}
.seglist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:34px;margin:6px 0}
.seglist span{background:var(--paper-2);border:2px solid var(--line);border-radius:99px;padding:2px 10px;font-size:14px}
.pair{display:grid;grid-template-columns:1fr;gap:4px}
@media (min-width:760px){.pair.two{grid-template-columns:1fr 1fr}}
.cap{text-align:center;font-size:14px;color:var(--ink-2);margin:-6px 0 6px}
.bil{color:var(--ink-2);font-style:italic;margin:2px 0 8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="lesson" id="lesson" role="dialog" aria-modal="true" aria-label="Leçon">
  <div class="lhead">
    <button class="close" id="lclose" aria-label="Quitter">×</button>
    <div class="bar" aria-hidden="true"><div id="lprog" style="width:0"></div></div>
    <span class="combo" id="combo"></span>
    <button class="lang" id="langL" aria-label="Langue / Language"><span data-l="fr">FR</span><span data-l="en">EN</span></button>
  </div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot" id="lfoot"><div class="in" id="lfootin"></div></div>
</div>
<script>
/* =====================================================================
   SETTINGS FOR THE TUTOR (change the text between the quotes)
   ===================================================================== */

// Optional. Leave empty: the student types their first name the first time.
const STUDENT_NAME = "";

// Your e-mail address: the "Envoyer mon rapport" button sends the report there
const TUTOR_EMAIL = "";

// Code to open the "Espace tuteur" (restart progress, unlock lessons)
const TUTOR_CODE = "1234";

/* =====================================================================
   HOW TO EDIT
   ---------------------------------------------------------------------
   Every text is written twice: B("français", "English").
   Lessons are in the section "LESSONS" (search for "L.repere", "L.image"...).
   The first answer of an mcq(...) is always the correct one (shuffled on screen).
   Keep quotes, commas and brackets exactly as they are.
   ===================================================================== */

/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const round=(n,d=4)=>Math.round(n*10**d)/10**d;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr=()=>new Date().toISOString().slice(0,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- languages ---------- */
let LANG="fr";
const B=(fr,en)=>({fr,en});
const tx=v=>v==null?"":(typeof v==="object"&&"fr" in v)?v[LANG]:String(v);
const nf=n=>{const s=String(round(n,3));return (LANG==="fr"?s.replace(".",","):s).replace("-","−")};
const parseNum=s=>{s=String(s).trim().replace(/\s/g,"").replace(",",".").replace("−","-");return s===""||isNaN(+s)?null:+s};

/* ---------- pointer position inside an SVG ---------- */
function svgXY(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:0,y:0}}

/* ---------- PLOT ENGINE ---------- */
let PLOT_ID=0;
function Plot(o){
  const P=Object.assign({xmin:-5,xmax:5,ymin:-5,ymax:5,w:360,h:300,xgrid:1,ygrid:1,xlab:0,ylab:0,xtitle:null,ytitle:null,labels:true,grid:true},o||{});
  P.pad=Object.assign({l:34,r:16,t:24,b:28},P.pad||{});
  if(!P.labels) P.pad=Object.assign({l:8,r:8,t:8,b:8},o&&o.pad||{});
  P.xlab=P.xlab||P.xgrid; P.ylab=P.ylab||P.ygrid;
  P.id="pl"+(++PLOT_ID);
  const W=P.w,H=P.h,l=P.pad.l,r=P.pad.r,t=P.pad.t,b=P.pad.b;
  P.sx=x=>l+(x-P.xmin)/(P.xmax-P.xmin)*(W-l-r);
  P.sy=y=>H-b-(y-P.ymin)/(P.ymax-P.ymin)*(H-t-b);
  P.ix=px=>P.xmin+(px-l)/(W-l-r)*(P.xmax-P.xmin);
  P.iy=py=>P.ymin+(H-b-py)/(H-t-b)*(P.ymax-P.ymin);
  const mult=(a,b,s)=>{const out=[];const st=Math.ceil(a/s-1e-9);for(let k=st;k*s<=b+1e-9;k++)out.push(round(k*s,6));return out};
  P.base=()=>{
    let g="";
    if(P.grid){
      for(const x of mult(P.xmin,P.xmax,P.xgrid)) g+=`<line x1="${P.sx(x)}" y1="${t}" x2="${P.sx(x)}" y2="${H-b}" style="stroke:var(--pgm)" stroke-width="1"/>`;
      for(const y of mult(P.ymin,P.ymax,P.ygrid)) g+=`<line x1="${l}" y1="${P.sy(y)}" x2="${W-r}" y2="${P.sy(y)}" style="stroke:var(--pgm)" stroke-width="1"/>`;
      for(const x of mult(P.xmin,P.xmax,P.xlab)) g+=`<line x1="${P.sx(x)}" y1="${t}" x2="${P.sx(x)}" y2="${H-b}" style="stroke:var(--pg)" stroke-width="1"/>`;
      for(const y of mult(P.ymin,P.ymax,P.ylab)) g+=`<line x1="${l}" y1="${P.sy(y)}" x2="${W-r}" y2="${P.sy(y)}" style="stroke:var(--pg)" stroke-width="1"/>`;
    }
    const ax=P.sx(clamp(0,P.xmin,P.xmax)), ay=P.sy(clamp(0,P.ymin,P.ymax));
    const S='style="stroke:var(--ink)" stroke-width="1.7"';
    g+=`<line x1="${l-4}" y1="${ay}" x2="${W-r+6}" y2="${ay}" ${S}/><path d="M${W-r+6} ${ay} l-8 -4 v8 z" style="fill:var(--ink)"/>`;
    g+=`<line x1="${ax}" y1="${H-b+4}" x2="${ax}" y2="${t-8}" ${S}/><path d="M${ax} ${t-8} l-4 8 h8 z" style="fill:var(--ink)"/>`;
    if(P.labels){
      for(const x of mult(P.xmin,P.xmax,P.xlab)){ if(x===0&&P.xmin<0) continue; g+=`<line x1="${P.sx(x)}" y1="${ay-3}" x2="${P.sx(x)}" y2="${ay+3}" ${S}/><text class="tk" x="${P.sx(x)}" y="${ay+14}" text-anchor="middle">${nf(x)}</text>`; }
      for(const y of mult(P.ymin,P.ymax,P.ylab)){ if(y===0) continue; g+=`<line x1="${ax-3}" y1="${P.sy(y)}" x2="${ax+3}" y2="${P.sy(y)}" ${S}/><text class="tk" x="${ax-6}" y="${P.sy(y)+4}" text-anchor="end">${nf(y)}</text>`; }
      if(P.xmin<0||P.ymin<0) g+=`<text class="tk" x="${ax-6}" y="${ay+14}" text-anchor="end">0</text>`;
      if(P.xtitle) g+=`<text class="ttl" x="${W-r}" y="${ay-8}" text-anchor="end">${esc(tx(P.xtitle))}</text>`;
      if(P.ytitle) g+=`<text class="ttl" x="${ax+8}" y="${t-6}" text-anchor="start">${esc(tx(P.ytitle))}</text>`;
    }
    return g;
  };
  P.curve=(f,o={})=>{
    const a=o.from??P.xmin, z=o.to??P.xmax, n=o.n||260; let d="", pen=false;
    const lim=(P.ymax-P.ymin)*3;
    for(let i=0;i<=n;i++){ const x=a+(z-a)*i/n, y=f(x);
      if(!isFinite(y)||y>P.ymax+lim||y<P.ymin-lim){pen=false;continue}
      d+=(pen?"L":"M")+P.sx(x).toFixed(1)+" "+P.sy(y).toFixed(1)+" "; pen=true; }
    return `<path d="${d}" fill="none" style="stroke:${o.color||"var(--c1)"}" stroke-width="${o.w||2.6}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} stroke-linecap="round" stroke-linejoin="round" ${o.id?`id="${o.id}"`:""}/>`;
  };
  P.seg=(x1,y1,x2,y2,o={})=>`<line x1="${P.sx(x1)}" y1="${P.sy(y1)}" x2="${P.sx(x2)}" y2="${P.sy(y2)}" style="stroke:${o.color||"var(--c1)"}" stroke-width="${o.w||2.6}" stroke-linecap="round" ${o.dash?`stroke-dasharray="${o.dash}"`:""}/>`;
  P.poly=(pts,o={})=>`<polyline points="${pts.map(([x,y])=>P.sx(x).toFixed(1)+","+P.sy(y).toFixed(1)).join(" ")}" fill="none" style="stroke:${o.color||"var(--c1)"}" stroke-width="${o.w||2.6}" stroke-linejoin="round" stroke-linecap="round" ${o.dash?`stroke-dasharray="${o.dash}"`:""}/>`;
  P.dot=(x,y,o={})=>`<circle cx="${P.sx(x)}" cy="${P.sy(y)}" r="${o.r||5}" style="fill:${o.fill||o.color||"var(--c1)"};stroke:${o.stroke||"var(--paper-2)"}" stroke-width="1.5"/>`+(o.label?`<text x="${P.sx(x)+(o.dx??8)}" y="${P.sy(y)+(o.dy??-8)}" font-size="13" font-weight="700" style="fill:${o.color||"var(--ink)"}" text-anchor="${o.anchor||"start"}">${esc(tx(o.label))}</text>`:"");
  P.text=(x,y,s,o={})=>`<text x="${P.sx(x)+(o.dx||0)}" y="${P.sy(y)+(o.dy||0)}" font-size="${o.size||13}" font-weight="700" style="fill:${o.color||"var(--ink)"}" text-anchor="${o.anchor||"middle"}">${esc(tx(s))}</text>`;
  P.svg=(inner="",cls="")=>`<svg class="plot ${cls}" id="${P.id}" viewBox="0 0 ${W} ${H}" role="img"><defs><clipPath id="${P.id}c"><rect x="${l}" y="${t-4}" width="${W-l-r}" height="${H-t-b+8}"/></clipPath></defs>${P.base()}<g clip-path="url(#${P.id}c)">${inner}</g><g class="ov"></g></svg>`;
  return P;
}
/* small thumbnail graph */
function thumb(draw,o={}){const P=Plot(Object.assign({w:160,h:120,labels:false,grid:true,xmin:-1,xmax:6,ymin:-1,ymax:6},o));return P.svg(draw(P),"thumb")}

/* ---------- drag & drop (works with mouse and finger; tap-tap also works) ---------- */
function dnd(root,chipSel,zoneSel,onDrop){
  let sel=null;
  const zoneAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest(zoneSel)&&root.contains(el.closest(zoneSel))?el.closest(zoneSel):null};
  root.querySelectorAll(chipSel).forEach(ch=>{
    ch.addEventListener("pointerdown",e=>{
      if(ch.dataset.lock) return; e.preventDefault();
      const sx=e.clientX,sy=e.clientY; let ghost=null,hot=null;
      try{ch.setPointerCapture(e.pointerId)}catch(_){}
      const mv=ev=>{
        if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){ghost=ch.cloneNode(true);ghost.classList.add("dragghost");ghost.style.width=ch.offsetWidth+"px";document.body.appendChild(ghost);ch.style.opacity=".35"}
        if(ghost){ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";const z=zoneAt(ev.clientX,ev.clientY);if(hot&&hot!==z)hot.classList.remove("hot");if(z){z.classList.add("hot");hot=z}}
      };
      const up=ev=>{
        ch.removeEventListener("pointermove",mv);ch.removeEventListener("pointerup",up);ch.removeEventListener("pointercancel",up);
        ch.style.opacity="";if(hot)hot.classList.remove("hot");
        if(ghost){ghost.remove();const z=zoneAt(ev.clientX,ev.clientY);sel=null;root.querySelectorAll(chipSel).forEach(c=>c.classList.remove("sel"));if(z)onDrop(ch,z)}
        else{ const was=sel===ch; root.querySelectorAll(chipSel).forEach(c=>c.classList.remove("sel")); sel=was?null:ch; if(sel)ch.classList.add("sel"); }
      };
      ch.addEventListener("pointermove",mv);ch.addEventListener("pointerup",up);ch.addEventListener("pointercancel",up);
    });
  });
  root.querySelectorAll(zoneSel).forEach(z=>z.addEventListener("click",e=>{ if(sel&&!e.target.closest(chipSel)){const c=sel;sel=null;c.classList.remove("sel");onDrop(c,z)} }));
  return {clear:()=>{sel=null}};
}

const W={};

/* drag a point along a curve and read (x ; f(x)) */
W.trace=o=>el=>{
  const P=Plot(o.plot), f=o.f, a=o.from??P.xmin, z=o.to??P.xmax, snap=o.snap||0.5;
  el.innerHTML=`${P.svg(P.curve(f,{from:a,to:z,color:o.color})+`<g class="dyn"></g>`,"tap")}<div class="readout" id="${P.id}r"></div><p class="hint">${tx(B("Fais glisser le point sur la courbe.","Drag the point along the curve."))}</p>`;
  const svg=el.querySelector("svg"), dyn=svg.querySelector(".dyn"), ro=el.querySelector(".readout");
  let x=o.start??a;
  const draw=()=>{const y=f(x);
    dyn.innerHTML=P.seg(x,0,x,y,{color:"var(--c2)",w:1.6,dash:"5 4"})+P.seg(0,y,x,y,{color:"var(--c3)",w:1.6,dash:"5 4"})+
      P.dot(x,0,{color:"var(--c2)",r:4})+P.dot(0,y,{color:"var(--c3)",r:4})+P.dot(x,y,{r:9,color:"var(--amber)"});
    ro.innerHTML=`<span style="color:var(--c2)">x = ${nf(x)}</span> &nbsp;→&nbsp; <span style="color:var(--c3)">${o.fname||"f"}(${nf(x)}) = ${nf(round(y,2))}</span><small>${tx(B(`L'image de ${nf(x)} est ${nf(round(y,2))}.`,`The image of ${nf(x)} is ${nf(round(y,2))}.`))}</small>`};
  const mv=e=>{const p=svgXY(svg,e);x=clamp(Math.round(P.ix(p.x)/snap)*snap,a,z);x=round(x,4);draw()};
  svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);mv(e);svg.onpointermove=mv});
  svg.addEventListener("pointerup",()=>{svg.onpointermove=null});

};

/* drag a horizontal line y = k and see the antécédents */
W.hline=o=>el=>{
  const P=Plot(o.plot), f=o.f, a=o.from??P.xmin, z=o.to??P.xmax, snap=o.snap||0.5;
  el.innerHTML=`${P.svg(P.curve(f,{from:a,to:z})+`<g class="dyn"></g>`,"tap")}<div class="readout"></div><p class="hint">${tx(B("Fais glisser la ligne verte vers le haut ou le bas.","Drag the green line up or down."))}</p>`;
  const svg=el.querySelector("svg"), dyn=svg.querySelector(".dyn"), ro=el.querySelector(".readout");
  let k=o.k0??1;
  const roots=k=>{const n=1600,r=[];let px=a,py=f(a)-k;if(Math.abs(py)<1e-7)r.push(a);
    for(let i=1;i<=n;i++){const x=a+(z-a)*i/n,y=f(x)-k; if(Math.abs(y)<1e-7)r.push(x); else if(py*y<0&&Math.abs(py)>1e-7)r.push(px+(x-px)*(-py)/(y-py)); px=x;py=y}
    const out=[];for(const x of r){const v=round(x,2);if(!out.some(u=>Math.abs(u-v)<0.05))out.push(v)}return out};
  const draw=()=>{const rs=roots(k);
    dyn.innerHTML=P.seg(P.xmin,k,P.xmax,k,{color:"var(--c3)",w:2.2})+rs.map(x=>P.seg(x,k,x,0,{color:"var(--c2)",w:1.6,dash:"5 4"})+P.dot(x,0,{color:"var(--c2)",r:5})+P.dot(x,k,{color:"var(--amber)",r:6})).join("")+P.dot(0,k,{color:"var(--c3)",r:6});
    const list=rs.map(nf).join(LANG==="fr"?" et ":" and ");
    ro.innerHTML=`<span style="color:var(--c3)">k = ${nf(k)}</span><small>${rs.length?tx(B(`${rs.length} antécédent${rs.length>1?"s":""} de ${nf(k)} : ${list}`,`${nf(k)} has ${rs.length} antécédent${rs.length>1?"s":""} (pre-image${rs.length>1?"s":""}): ${list}`)):tx(B(`${nf(k)} n'a aucun antécédent : la ligne ne touche pas la courbe.`,`${nf(k)} has no antécédent: the line doesn't touch the curve.`))}</small>`};
  const mv=e=>{const p=svgXY(svg,e);k=clamp(Math.round(P.iy(p.y)/snap)*snap,P.ymin,P.ymax);k=round(k,4);draw()};
  svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);mv(e);svg.onpointermove=mv});
  svg.addEventListener("pointerup",()=>{svg.onpointermove=null});
  draw();
};

/* vertical line test */
W.vline=()=>el=>{
  const curves=[
    {n:B("Parabole","Parabola"),fn:true,d:P=>P.curve(x=>x*x/2-2),hits:c=>[c*c/2-2]},
    {n:B("Droite","Line"),fn:true,d:P=>P.curve(x=>x/2+1),hits:c=>[c/2+1]},
    {n:B("Cercle","Circle"),fn:false,d:P=>`<circle cx="${P.sx(0)}" cy="${P.sy(0)}" r="${P.sx(3)-P.sx(0)}" fill="none" style="stroke:var(--c1)" stroke-width="2.6"/>`,hits:c=>Math.abs(c)<=3?(Math.abs(c)===3?[0]:[Math.sqrt(9-c*c),-Math.sqrt(9-c*c)]):[]},
    {n:B("Parabole couchée","Sideways parabola"),fn:false,d:P=>{let pts=[];for(let i=0;i<=120;i++){const y=-4+8*i/120;pts.push([y*y/2-3,y])}return P.poly(pts)},hits:c=>c>-3?[Math.sqrt(2*(c+3)),-Math.sqrt(2*(c+3))]:(c===-3?[0]:[])},
  ];
  let cur=0,c=1;
  const render=()=>{
    const P=Plot({xmin:-5,xmax:5,ymin:-5,ymax:5,w:340,h:300});
    el.innerHTML=`<div class="tabs">${curves.map((k,i)=>`<button class="btn sm ${i===cur?"on":""}" data-i="${i}">${tx(k.n)}</button>`).join("")}</div>${P.svg(curves[cur].d(P)+`<g class="dyn"></g>`,"tap")}<div class="readout"></div><p class="hint">${tx(B("Fais glisser la ligne rouge de gauche à droite.","Drag the red line from left to right."))}</p>`;
    el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
    const svg=el.querySelector("svg"),dyn=svg.querySelector(".dyn"),ro=el.querySelector(".readout");
    const draw=()=>{const hs=curves[cur].hits(c).filter(y=>y>=-5&&y<=5);
      dyn.innerHTML=P.seg(c,-5,c,5,{color:"var(--c2)",w:2.2})+hs.map(y=>P.dot(c,y,{color:"var(--amber)",r:7})).join("");
      const ok=hs.length<=1;
      ro.innerHTML=`<span style="color:${ok?"var(--green)":"var(--red)"}">${tx(B(`${hs.length} point${hs.length>1?"s":""} touché${hs.length>1?"s":""}`,`${hs.length} point${hs.length>1?"s":""} hit`))}</span><small>${curves[cur].fn?tx(B("Jamais plus d'un point : c'est une fonction.","Never more than one point: it is a function.")):tx(B("Parfois 2 points : un même x aurait 2 images. Ce n'est pas une fonction.","Sometimes 2 points: one x would have 2 images. It is not a function."))}</small>`};
    const mv=e=>{const p=svgXY(svg,e);c=clamp(Math.round(P.ix(p.x)*2)/2,-5,5);draw()};
    svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);mv(e);svg.onpointermove=mv});
    svg.addEventListener("pointerup",()=>{svg.onpointermove=null});
    draw();
  };
  render();
};

/* sliders: play with a and b */
W.sliders=()=>el=>{
  let mode=0;const st={a:1,b:0,q:1,base:2};
  const tabs=[B("Affine : ax + b","Linear: ax + b"),B("Carré : ax²","Quadratic: ax²"),B("Exponentielle : bˣ","Exponential: bˣ")];
  const CTL=[[["a",-3,3,0.5],["b",-4,4,1]],[["q",-2,2,0.25]],[["base",0.5,3,0.25]]];
  const lab={a:"a",b:"b",q:"a",base:"b"};
  const update=()=>{const {a,b,q,base}=st;let f,formula,note;
    if(mode===0){f=x=>a*x+b;formula=`f(x) = ${nf(a)}x ${b<0?"−":"+"} ${nf(Math.abs(b))}`;note=a===0?B("a = 0 : la droite est horizontale (fonction constante).","a = 0: the line is horizontal (constant function)."):a>0?B("a > 0 : la droite monte. Plus a est grand, plus elle est penchée. b est l'endroit où elle coupe l'axe des ordonnées.","a > 0: the line goes up. The bigger a, the steeper. b is where it crosses the y-axis (axe des ordonnées)."):B("a < 0 : la droite descend. b est l'endroit où elle coupe l'axe des ordonnées.","a < 0: the line goes down. b is where it crosses the y-axis (axe des ordonnées).")}
    else if(mode===1){f=x=>q*x*x;formula=`f(x) = ${nf(q)}x²`;note=q===0?B("a = 0 : il ne reste que f(x) = 0, une droite.","a = 0: only f(x) = 0 is left, a line."):q>0?B("a > 0 : la parabole est ouverte vers le haut (U).","a > 0: the parabola opens upwards (U)."):B("a < 0 : la parabole est ouverte vers le bas (∩).","a < 0: the parabola opens downwards (∩).")}
    else{f=x=>base**x;formula=`f(x) = ${nf(base)}<sup>x</sup>`;note=base===1?B("b = 1 : 1ˣ vaut toujours 1, c'est constant.","b = 1: 1ˣ is always 1, it's constant."):base>1?B("b > 1 : croissance exponentielle, elle explose vers la droite.","b > 1: exponential growth, it explodes to the right."):B("b < 1 : décroissance exponentielle, elle s'écrase vers 0.","b < 1: exponential decay, it shrinks towards 0.")}
    const P=Plot({xmin:-4,xmax:4,ymin:-5,ymax:6,w:340,h:290});
    el.querySelector(".formula").innerHTML=formula;el.querySelector(".pbox").innerHTML=P.svg(P.curve(f));el.querySelector(".note").textContent=tx(note);
    el.querySelectorAll("[data-k]").forEach(r=>{r.previousElementSibling.textContent=`${lab[r.dataset.k]} = ${nf(st[r.dataset.k])}`})};
  const render=()=>{
    el.innerHTML=`<div class="tabs">${tabs.map((t,i)=>`<button class="btn sm ${i===mode?"on":""}" data-i="${i}">${tx(t)}</button>`).join("")}</div><div class="formula"></div><div class="pbox"></div>${CTL[mode].map(([k,mn,mx,sp])=>`<div class="sl"><label></label><input type="range" min="${mn}" max="${mx}" step="${sp}" value="${st[k]}" data-k="${k}" aria-label="${lab[k]}"></div>`).join("")}<p class="hint note"></p>`;
    el.querySelectorAll(".tabs button").forEach(bt=>bt.onclick=()=>{mode=+bt.dataset.i;render()});
    el.querySelectorAll("[data-k]").forEach(r=>r.oninput=()=>{st[r.dataset.k]=+r.value;update()});
    update()};
  render();
};

/* race: linear vs quadratic vs exponential */
W.race=()=>el=>{
  let d=3;
  const F=[{n:"A",f:x=>20*x,lab:"20x",c:"var(--c1)"},{n:"B",f:x=>x*x,lab:"x²",c:"var(--c3)"},{n:"C",f:x=>2**x,lab:"2<sup>x</sup>",c:"var(--c2)"}];
  el.innerHTML=`<div class="pbox"></div><div class="sl"><label></label><input type="range" min="0" max="12" step="1" value="${d}" aria-label="${tx(B("Jour","Day"))}"></div><div class="tbox"></div><p class="hint"></p>`;
  const update=()=>{
    const vals=F.map(k=>k.f(d)), top=Math.max(...vals), ym=Math.max(60,Math.ceil(top*1.15/10)*10);
    const yl=[10,20,50,100,200,500,1000].find(s=>ym/s<=6)||1000;

/* runner with distance-time and speed-time graphs drawing themselves */
function simulate(segs){
  let t0=0,x0=0;const S=[];
  for(const s of segs){const a=s.a||0;S.push({t0,x0,v0:s.v0,a,d:s.d});x0+=s.v0*s.d+a*s.d*s.d/2;t0+=s.d}
  const T=t0||1, find=t=>S.find(s=>t<=s.t0+s.d+1e-9)||S[S.length-1];
  const pos=t=>{if(!S.length)return 0;const s=find(t),u=clamp(t-s.t0,0,s.d);return s.x0+s.v0*u+s.a*u*u/2};
  const vel=t=>{if(!S.length)return 0;const s=find(t),u=clamp(t-s.t0,0,s.d);return s.v0+s.a*u};
  return {T,pos,vel,S};
}
const niceStep=(range,max=7)=>[1,2,5,10,20,50,100].find(s=>range/s<=max)||100;

  {n:B("Aller-retour","There and back"),segs:[{v0:4,d:8},{v0:0,d:4},{v0:-4,d:8}],t:B("Au retour, il se rapproche du départ : la distance <b>descend</b>. Il va dans l'autre sens, donc sa vitesse est <b>négative</b> : −4 m/s.","On the way back, he gets closer to the start: the distance <b>goes down</b>. He moves the other way, so his speed is <b>negative</b>: −4 m/s.")},

];
W.runner=o=>el=>{
  const build=o.mode==="build";
  let cur=0,segs=build?[]:RUN_SCEN[0].segs,raf=null,t=0,playing=false;
  const SEGS={fwd:{v0:4,d:5,n:B("Avancer","Forward")},stop:{v0:0,d:5,n:B("Arrêt","Stop")},back:{v0:-4,d:5,n:B("Revenir","Back")},acc:{v0:0,a:0.8,d:5,n:B("Accélérer","Speed up")}};
  const endV=()=>{const sim=simulate(segs);return segs.length?sim.vel(sim.T):0};
  const render=()=>{
    if(raf)cancelAnimationFrame(raf);

    const ys=niceStep(pmax-pmin,6), ylo=Math.floor(pmin/ys)*ys, yhi=Math.ceil(pmax/ys)*ys||ys;

    el.innerHTML=`${top}
      <svg class="track" viewBox="0 0 360 84"><line x1="20" y1="62" x2="345" y2="62" style="stroke:var(--ink)" stroke-width="2"/>${ticks}
        <line x1="${mx(0)}" y1="30" x2="${mx(0)}" y2="62" style="stroke:var(--green)" stroke-width="2"/><path d="M${mx(0)} 30 l14 5 l-14 5z" style="fill:var(--green)"/>
        <g class="runner"><circle cx="0" cy="19" r="5.5" style="fill:var(--c2)"/><g style="stroke:var(--c2)" stroke-width="3" stroke-linecap="round" fill="none"><path d="M0 25 L0 42"/><path class="arms" d="M0 30 L-7 37 M0 30 L8 34"/><path class="legs" d="M0 42 L-6 58 M0 42 L7 57"/></g></g></svg>
      <div class="readout"></div>
      <div class="pair two"><div>${Pd.svg(`<g class="dyn"></g>`)}</div><div>${Pv.svg(`<g class="dyn"></g>`)}</div></div>

      ${build?`<p class="hint">${tx(B("S'il revient plus loin que le départ, sa position devient négative : il est derrière la ligne de départ.","If he comes back past the start, his position becomes negative: he is behind the start line."))}</p>`:`<p>${tx(RUN_SCEN[cur].t)}</p>`}`;
    const [sd,sv]=el.querySelectorAll(".pair svg"), dd=sd.querySelector(".dyn"), dv=sv.querySelector(".dyn"), rn=el.querySelector(".runner"), ro=el.querySelector(".readout"), legs=el.querySelector(".legs"), arms=el.querySelector(".arms");

      const step=ts=>{if(!el.isConnected){playing=false;return}if(t0==null)t0=ts;t=Math.min(T,(ts-t0)/1000*3.2);frame(t);if(t<T)raf=requestAnimationFrame(step);else playing=false};
      raf=requestAnimationFrame(step)};
    el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;segs=RUN_SCEN[cur].segs;render();play()});

    const cl=el.querySelector("[data-clear]");if(cl)cl.onclick=()=>{segs=[];render()};

function streakNow(){const st=DB.s.streak,t=todayStr(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);return (st.last===t||st.last===y)?st.n:0}
const getName=()=>((DB.s.name)||STUDENT_NAME||"").trim();

    <section class="hero" style="padding-top:14px"><h1 style="font-size:clamp(28px,6vw,40px)">${U("Les fonctions","Functions")}</h1><p>${U("Graphiques, images, antécédents, vitesse et distance. Une leçon à la fois.","Graphs, images, antécédents, speed and distance. One lesson at a time.")}</p></section>
    <div class="path">${PATH.map((id,i)=>{const done=D.done[id],locked=!DB.unlockAll&&firstOpen!==-1&&i>firstOpen,now=i===firstOpen;
      return `<div class="step"><button class="bubble ${done?"done":now?"now":locked?"locked":DB.preview?"pv":""}" data-id="${id}" ${locked?'aria-disabled="true"':""} aria-label="${esc(tx(L[id].title))}">${locked?LOCK:esc(L[id].glyph)}</button><div class="stars">${done?starsHTML(done.stars):""}</div><div class="steplbl">${esc(tx(L[id].title))}</div></div>`}).join("")}</div>

/* ---------- lesson engine ---------- */
const lesson=document.getElementById("lesson"),lbody=document.getElementById("lbody"),lfoot=document.getElementById("lfoot"),lfootin=document.getElementById("lfootin"),lprog=document.getElementById("lprog"),comboEl=document.getElementById("combo");
let S=null;
function startLesson(id){
  const items=L[id].build();
  S={id,missed:[],queue:[...items],done:0,mistakes:0,xp:0,combo:0,retry:new Set(),t0:Date.now(),firstTry:0,phase:"answer",fb:null,r:null,preview:!!DB.preview,items,pi:0,shown:false,hist:[],rv:null,skipped:new Set(),skips:0};
  lesson.classList.add("open");document.body.style.overflow="hidden";syncLangBtns();
  if(S.preview)pvGo(0);else next();
}
function quit(){lesson.classList.remove("open");document.body.style.overflow="";S=null;path()}
document.getElementById("lclose").onclick=quit;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S&&lesson.classList.contains("open"))quit()});
function setProg(){const tot=S.done+S.queue.length;lprog.style.width=(tot?S.done/tot*100:0)+"%";comboEl.textContent=S.combo>=3?U(`${S.combo} d'affilée`,`${S.combo} in a row`):""}
function footer(html,cls=""){lfoot.className="lfoot "+cls;lfootin.innerHTML=html}

function next(){setProg();if(!S.queue.length)return finish();S.cur=S.queue[0];S.phase="answer";S.fb=null;renderItem()}
function rerenderItem(){if(S.rv!=null)return rvGo(S.rv);if(S.preview){if(S.phase==="end")return pvEnd();renderItem();if(S.shown)pvShow();return}if(S.phase==="end")return finish(true);renderItem();if(S.phase==="feedback"){if(S.r.solve)S.r.solve();if(S.r.lock)S.r.lock();feedbackFooter()}}
function drawItem(it,suffix){
  lbody.innerHTML=`<p class="kind">${esc(tx(L[S.id].title))}${suffix}</p><div id="ibox"></div>`;
  const box=document.getElementById("ibox");
  const api={ready:on=>{const c=document.getElementById("chk");if(c)c.disabled=!on},finish:(ok,ex)=>{if(S.rv==null)graded(ok,ex,true)}};
  let r={};
  if(it.t==="info"){box.innerHTML=`<div class="info"><h3>${tx(it.title)}</h3>${typeof it.html==="function"?it.html():tx(it.html)}<div class="wg"></div></div>`;if(it.widget)it.widget(box.querySelector(".wg"))}
  else{box.innerHTML=`${it.fig?it.fig():""}<div class="q ${it.qsmall?"small":""}">${tx(it.q)}</div><div class="ia"></div>`;r=R[it.t](it,box.querySelector(".ia"),api)}
  lbody.scrollTop=0;return r;
}
function renderItem(){
  const it=S.cur;S.rv=null;
  const suffix=S.retry.has(it)?U(" (2ᵉ essai)"," (2nd try)"):S.skipped.has(it)?U(" (question passée)"," (skipped question)"):"";
  S.r=drawItem(it,suffix);
  if(S.preview)return pvFooter();
  const prev=S.hist.length?`<button class="btn" id="bPrev">${U("Précédent","Previous")}</button>`:"";
  const skip=it.t!=="info"&&S.queue.length>1?`<button class="btn" id="bSkip">${U("Passer","Skip")}</button>`:"";
  const grp=main=>`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${prev}${skip}${main}</div>`;
  if(it.t==="info"){
    footer(`<span class="fb"></span>${grp(`<button class="btn primary" id="cont">${U("J'ai compris","Got it")}</button>`)}`);
    document.getElementById("cont").onclick=()=>{if(!S.hist.includes(it))S.hist.push(it);S.queue.shift();S.done++;next()};
  } else if(it.t!=="match"){
    footer(`<span class="fb" style="color:var(--ink-2)">${tx(R[it.t].hint||B("Réponds, puis vérifie.","Answer, then check."))}</span>${grp(`<button class="btn primary" id="chk" ${S.r.readyNow?"":"disabled"}>${U("Vérifier","Check")}</button>`)}`);
    document.getElementById("chk").onclick=()=>{const ok=S.r.check();if(S.r.lock)S.r.lock();graded(ok,it.ex)};
  } else footer(`<span class="fb" style="color:var(--ink-2)">${tx(R.match.hint)}</span>${grp("")}`);
  const bp=document.getElementById("bPrev");if(bp)bp.onclick=()=>rvGo(S.hist.length-1);
  const bs=document.getElementById("bSkip");if(bs)bs.onclick=skipItem;
}
/* ---------- student: skip (comes back at the end) and review previous ---------- */
function skipItem(){const it=S.queue.shift();S.queue.push(it);S.skipped.add(it);S.skips++;next()}
function rvGo(i){
  S.rv=i;const it=S.hist[i];const r=drawItem(it,U(" (révision)"," (review)"));
  if(it.t!=="info"){if(r.solve)r.solve();if(r.lock)r.lock()}
  const ans=it.t==="input"?`${U("Réponse : ","Answer: ")}<b>${nf(it.a)}${it.unit?" "+it.unit:""}</b>. `:"";
  footer(`<div class="fb"><strong class="verdict">${U("Révision","Review")} ${i+1} / ${S.hist.length}</strong>${it.t!=="info"?ans+(it.ex?`<span>${tx(it.ex)}</span>`:""):`<span style="color:var(--ink-2)">${U("Relis la leçon, puis reviens à ta question.","Read the lesson again, then go back to your question.")}</span>`}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" id="rvPrev" ${i===0?"disabled":""}>${U("Précédent","Previous")}</button><button class="btn" id="rvNext" ${i===S.hist.length-1?"disabled":""}>${U("Suivant","Next")}</button><button class="btn primary" id="rvBack">${U("Revenir à ma question","Back to my question")}</button></div>`);
  document.getElementById("rvPrev").onclick=()=>rvGo(i-1);document.getElementById("rvNext").onclick=()=>rvGo(i+1);
  document.getElementById("rvBack").onclick=()=>{S.rv=null;renderItem()};
}
/* ---------- tutor preview mode: browse without answering ---------- */
function pvGo(i){if(i<0)i=0;if(i>=S.items.length)return pvEnd();S.pi=i;S.cur=S.items[i];S.phase="answer";S.shown=false;lprog.style.width=(i/S.items.length*100)+"%";comboEl.textContent="";renderItem()}
function pvNav(){return `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="pvPrev" ${S.pi===0?"disabled":""}>${U("Précédent","Previous")}</button>${S.cur.t!=="info"&&!S.shown?`<button class="btn" id="pvShow">${U("Voir la réponse","Show answer")}</button>`:""}<button class="btn primary" id="pvNext">${S.pi===S.items.length-1?U("Terminer","Finish"):U("Suivant","Next")}</button></div>`}
function pvWire(){document.getElementById("pvPrev").onclick=()=>pvGo(S.pi-1);document.getElementById("pvNext").onclick=()=>pvGo(S.pi+1);const s=document.getElementById("pvShow");if(s)s.onclick=pvShow}
function pvFooter(){footer(`<span class="fb" style="color:var(--ink-2)">${U("Aperçu tuteur","Tutor preview")} : ${S.pi+1} / ${S.items.length}</span>${pvNav()}`);pvWire()}
function pvShow(){const it=S.cur;S.shown=true;if(S.r&&S.r.solve)S.r.solve();if(S.r&&S.r.lock)S.r.lock();
  const ans=it.t==="input"?`${U("Réponse : ","Answer: ")}<b>${nf(it.a)}${it.unit?" "+it.unit:""}</b>. `:"";
  footer(`<div class="fb"><strong class="verdict" style="color:var(--green)">${U("Réponse","Answer")}</strong>${ans}${it.ex?`<span>${tx(it.ex)}</span> `:""}${it.shape?`<span>${tx(it.shape)}</span>`:""}</div>${pvNav()}`,"right");pvWire()}
function pvEnd(){S.phase="end";lprog.style.width="100%";
  lbody.innerHTML=`<div class="end"><p class="big">${U("Fin de l'aperçu","End of preview")}</p><p style="color:var(--ink-2)">${U("Rien n'a été enregistré.","Nothing was saved.")}</p></div>`;
  footer(`<span class="fb"></span><div style="display:flex;gap:8px"><button class="btn" id="pvBack">${U("Revenir à la dernière question","Back to the last question")}</button><button class="btn go" id="cont">${U("Retour aux leçons","Back to lessons")}</button></div>`);

    <div class="grp"><span>${U("Droite","Right")} :</span><button class="btn sm" data-c="bc1">] ${U("inclus","included")}</button><button class="btn sm" data-c="bc0">[ ${U("exclu","excluded")}</button><button class="btn sm" data-c="binf">+∞</button></div></div>
    <p class="hint">${U("Fais glisser les bornes sur la droite graduée, puis choisis les crochets.","Drag the ends along the number line, then choose the brackets.")}</p>`;
  const svg=el.querySelector("svg"),nt=el.querySelector(".notation");
  const draw=()=>{
    const y=48,x1=a===-Infinity?P.sx(-6):P.sx(a),x2=b===Infinity?P.sx(6):P.sx(b);
    let s=`<line x1="${P.sx(-6)}" y1="${y}" x2="${P.sx(6)}" y2="${y}" style="stroke:var(--ink)" stroke-width="1.6"/>`;
    for(let v=-5;v<=5;v++)s+=`<line x1="${P.sx(v)}" y1="${y-5}" x2="${P.sx(v)}" y2="${y+5}" style="stroke:var(--ink-2)"/><text x="${P.sx(v)}" y="${y+24}" font-size="12" text-anchor="middle" style="fill:var(--ink-2)">${nf(v)}</text>`;
    s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="stroke:var(--c1)" stroke-width="7"/>`;
    if(a===-Infinity)s+=`<path d="M${x1-4} ${y} l12 -8 v16z" style="fill:var(--c1)"/>`;else s+=`<circle cx="${x1}" cy="${y}" r="11" style="fill:var(--amber);opacity:.35"/><text x="${x1}" y="${y-12}" font-size="28" font-weight="800" text-anchor="middle" style="fill:var(--c1)">${ac?"[":"]"}</text>`;
    if(b===Infinity)s+=`<path d="M${x2+4} ${y} l-12 -8 v16z" style="fill:var(--c1)"/>`;else s+=`<circle cx="${x2}" cy="${y}" r="11" style="fill:var(--amber);opacity:.35"/><text x="${x2}" y="${y-12}" font-size="28" font-weight="800" text-anchor="middle" style="fill:var(--c1)">${bc?"]":"["}</text>`;
    svg.innerHTML=s; nt.textContent=notation();
    const on={ac1:a!==-Infinity&&ac,ac0:a!==-Infinity&&!ac,ainf:a===-Infinity,bc1:b!==Infinity&&bc,bc0:b!==Infinity&&!bc,binf:b===Infinity};
    el.querySelectorAll("[data-c]").forEach(bt=>bt.classList.toggle("on",on[bt.dataset.c]));
  };
  el.querySelectorAll("[data-c]").forEach(bt=>bt.onclick=()=>{if(locked)return;const c=bt.dataset.c;
    if(c==="ac1"||c==="ac0"){if(a===-Infinity)a=Math.max(-5,(b===Infinity?3:b)-3);ac=c==="ac1"}
    if(c==="bc1"||c==="bc0"){if(b===Infinity)b=Math.min(5,(a===-Infinity?-3:a)+3);bc=c==="bc1"}
    if(c==="ainf")a=-Infinity;if(c==="binf")b=Infinity;draw()});
  const mv=e=>{if(!drag)return;const v=clamp(Math.round(P.ix(svgXY(svg,e).x)),-5,5);
    if(drag==="a"&&(b===Infinity||v<b)&&v!==a){a=v;draw()}else if(drag==="b"&&(a===-Infinity||v>a)&&v!==b){b=v;draw()}};
  svg.addEventListener("pointerdown",e=>{if(locked)return;const v=P.ix(svgXY(svg,e).x);const da=a===-Infinity?99:Math.abs(v-a),db=b===Infinity?99:Math.abs(v-b);if(da===99&&db===99)return;drag=da<=db?"a":"b";try{svg.setPointerCapture(e.pointerId)}catch(_){}mv(e)});
  svg.addEventListener("pointermove",mv);svg.addEventListener("pointerup",()=>{drag=null});svg.addEventListener("pointercancel",()=>{drag=null});
  draw();
  const t=it.target;
  return {readyNow:true,check:()=>a===t.a&&b===t.b&&(a===-Infinity||ac===t.ac)&&(b===Infinity||bc===t.bc),lock:()=>{locked=true;el.querySelectorAll("button").forEach(x=>x.disabled=true)},solve:()=>{a=t.a;b=t.b;ac=t.ac;bc=t.bc;draw()}};
};
R.numline.hint=B("Construis l'intervalle, puis vérifie.","Build the interval, then check.");

/* ---------- tutor area ---------- */
function tutorGate(){SCREEN=tutorGate;
  app.innerHTML=`<div class="top"><h2>${U("Espace tuteur","Tutor area")}</h2>${langBtnHTML()}</div><p style="color:var(--ink-2)">${U("Cette partie est réservée au tuteur.","This part is for the tutor.")}</p>
    <div class="numin"><input id="code" type="password" inputmode="numeric" autocomplete="off" aria-label="Code"><button class="btn primary" id="codeOk">${U("Entrer","Enter")}</button></div><p id="codeMsg" style="color:var(--red);min-height:1.5em"></p><button class="btn ghost" id="tBack">${U("Retour","Back")}</button>`;
  const inp=document.getElementById("code");const go=()=>{if(inp.value.trim()===TUTOR_CODE)tutorPanel();else{document.getElementById("codeMsg").textContent=U("Code incorrect.","Wrong code.");inp.value="";inp.focus()}};
  document.getElementById("codeOk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};document.getElementById("tBack").onclick=path;inp.focus();
}
function tutorPanel(){SCREEN=tutorPanel;
  const D=DB.s,done=PATH.filter(id=>D.done[id]).length;
  app.innerHTML=`<div class="top"><h2>${U("Espace tuteur","Tutor area")}</h2>${langBtnHTML()}</div><p>${esc(getName())} : ${done} / ${PATH.length} ${U("leçons terminées","lessons done")}, ${D.xp} XP.</p>
    <div class="tpanel">
      <div><h3>${U("Mode aperçu","Preview mode")}</h3><p>${U("Pour parcourir toutes les leçons sans répondre : boutons Précédent, Voir la réponse et Suivant (flèches du clavier aussi). Rien n'est enregistré tant que ce mode est actif. Il ne concerne que cet appareil.","To browse every lesson without answering: Previous, Show answer and Next buttons (keyboard arrows too). Nothing is saved while this mode is on. It only affects this device.")}</p><button class="btn ${DB.preview?"on":""}" id="tPreview">${DB.preview?U("Désactiver le mode aperçu","Turn preview mode off"):U("Activer le mode aperçu","Turn preview mode on")}</button></div>
      <div><h3>${U("Prénom de l'élève","Student's first name")}</h3><div class="numin"><input id="tName" maxlength="30" autocomplete="off" value="${esc(getName())}" style="width:240px;font-size:20px"><button class="btn primary" id="tNameOk">${U("Enregistrer","Save")}</button></div></div>
      <div><h3>${U("Recommencer à zéro","Start again from zero")}</h3><p>${U("Efface toute la progression sur cet appareil. Le prénom est conservé.","Erases all progress on this device. The name is kept.")}</p><button class="btn" id="tReset" style="color:var(--red)">${U("Effacer la progression","Erase progress")}</button></div>
      <div><h3>${U("Ordre des leçons","Lesson order")}</h3><p>${DB.unlockAll?U("Toutes les leçons sont ouvertes.","All lessons are open."):U("Les leçons s'ouvrent une par une.","Lessons open one by one.")}</p><button class="btn" id="tUnlock">${DB.unlockAll?U("Revenir à l'ordre normal","Back to normal order"):U("Ouvrir toutes les leçons","Open all lessons")}</button></div>
    </div><button class="btn primary" id="tBack">${U("Retour","Back")}</button>`;
  const tn=document.getElementById("tName"),tok=document.getElementById("tNameOk");tok.onclick=()=>{D.name=tn.value.trim();save();tok.textContent=U("Enregistré","Saved");setTimeout(tutorPanel,700)};
  const r=document.getElementById("tReset");r.onclick=()=>{if(r.dataset.c){const n=D.name;DB.s=fresh();DB.s.name=n;DB.unlockAll=false;save();r.textContent=U("Progression effacée","Progress erased");r.disabled=true;setTimeout(tutorPanel,800)}else{r.dataset.c=1;r.textContent=U("Confirmer : tout effacer","Confirm: erase everything")}};
  document.getElementById("tPreview").onclick=()=>{DB.preview=!DB.preview;save();tutorPanel()};
  document.getElementById("tUnlock").onclick=()=>{DB.unlockAll=!DB.unlockAll;save();tutorPanel()};
  document.getElementById("tBack").onclick=path;
}

/* ---------- report (always in French, for the tutor) ---------- */
const fmtDate=iso=>new Date(iso).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
const fmtTime=sec=>sec>=60?`${Math.floor(sec/60)} min ${sec%60} s`:`${sec} s`;
function reportText(){
  const D=DB.s,now=new Date();
  const lines=[`Rapport : Les fonctions, ${getName()||"élève"}`,`Envoyé le ${now.toLocaleDateString("fr-FR")} à ${now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}`,`XP total : ${D.xp}. Série actuelle : ${streakNow()} jour(s).`,""];
  const done=PATH.filter(id=>D.done[id]);lines.push(`LEÇONS TERMINÉES : ${done.length} sur ${PATH.length}`);
  for(const id of done){const runs=D.history.filter(h=>h.id===id),last=runs[runs.length-1];lines.push(last?`- ${L[id].title.fr} : ${fmtDate(last.at)}, ${last.stars}/3 étoiles, ${last.mistakes} erreur(s)${last.skips?`, ${last.skips} passée(s)`:""}, ${fmtTime(last.secs)}${runs.length>1?` (faite ${runs.length} fois)`:""}`:`- ${L[id].title.fr}`)}
  const todo=PATH.filter(id=>!D.done[id]);lines.push("",`PAS ENCORE FAITES : ${todo.length?todo.map(id=>L[id].title.fr).join(", "):"aucune"}`,"");
  const missed=[];D.history.filter(h=>h.missed&&h.missed.length).slice(-8).forEach(h=>h.missed.forEach(q=>missed.push(`- [${L[h.id]?L[h.id].title.fr:h.id}] ${q}`)));
  lines.push("QUESTIONS RATÉES (dernières leçons) :",...(missed.length?missed.slice(-15):["- aucune"]));
  return lines.join("\n");
}
function report(){SCREEN=report;
  const txt=reportText();
  app.innerHTML=`<div class="top"><h2>${U("Rapport pour le tuteur","Report for your tutor")}</h2>${langBtnHTML()}</div><div class="report"><p style="color:var(--ink-2)">${U("Envoie ce rapport à ton tuteur quand tu as fini.","Send this report to your tutor when you have finished.")}</p>
    <textarea readonly id="repTxt">${esc(txt)}</textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><a class="btn primary" style="text-decoration:none" href="mailto:${encodeURIComponent(TUTOR_EMAIL)}?subject=${encodeURIComponent("Maths, les fonctions : "+(getName()||"élève"))}&body=${encodeURIComponent(txt)}">${U("Envoyer par e-mail","Send by e-mail")}</a>
    <button class="btn" id="copyBtn">${U("Copier le texte","Copy the text")}</button><button class="btn ghost" id="repBack">${U("Retour","Back")}</button></div></div>`;
  document.getElementById("repBack").onclick=path;
  const cb=document.getElementById("copyBtn");cb.onclick=async()=>{const t=document.getElementById("repTxt");try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand("copy")}cb.textContent=U("Copié","Copied")};
}

load(); document.documentElement.lang=LANG; path();
</script>
